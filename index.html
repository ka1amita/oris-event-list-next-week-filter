<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Next week</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<script>
const fmt = d => d.toLocaleDateString('sv'); // local YYYY-MM-DD
const now = new Date();
const from = new Date(now);
from.setDate(now.getDate() + (7 - now.getDay()) % 7 + 1); // Monday after this week's Sunday
const to = new Date(from);
to.setDate(from.getDate() + 6); // following Sunday
location.replace(`https://oris.ceskyorientak.cz/?date_from=${fmt(from)}&date_to=${fmt(to)}&repre=0&sport=0&reg=0&all=1&mode=map&notcanc=1`);
</script>
